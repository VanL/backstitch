coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 2%
        base: auto
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: false
    patch:
      default:
        target: 50%
        threshold: 15%
        base: auto
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "**/__pycache__"
  - "**/tests/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "setup.py"
  - "**/examples/**"
  - "**/agent_history/**"
  - "**/weft/**"
