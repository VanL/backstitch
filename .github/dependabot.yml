version: 2
updates:
  # Maintain uv-managed root dependencies, including the locked release group.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    assignees:
      - "VanL"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain reviewed full-SHA GitHub Action references.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "VanL"
    commit-message:
      prefix: "ci"
      include: "scope"
