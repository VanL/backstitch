name: CI

# Hermetic CI runs on every push and PR with no secrets. Repository pytest
# config enables live LLM tests for local runs, so CI explicitly deselects or
# disables them. Provider-backed semantic refresh is isolated in the manual
# semantic-refresh workflow and never runs in pull-request-controlled CI.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate-wiring rule (writing-specs runbook): every gate names its
  # execution path. These three were previously lint-only in CI — the
  # "silently never runs anywhere" defect. stdlib-only, no uv needed.
  doc-gates:
    name: doc gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # coalesce-check resolves SHA claims and retrieval cues from
          # history; on a shallow clone it skips loudly by design, which
          # would make this job vacuous.
          fetch-depth: 0
      - name: Path-claim integrity (self-test, then real run)
        run: |
          python3 bin/check-doc-paths --self-test
          python3 bin/check-doc-paths
      - name: DOM-15 fixture gate (self-test, then real run)
        run: |
          python3 bin/check-dom15-fixtures --self-test
          python3 bin/check-dom15-fixtures
      - name: Coalescing SHA/cue provenance trail
        run: python3 bin/coalesce-check

  test:
    name: hermetic py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      # Pin reviewed at implementation time; re-check the action's latest major
      # when touching this workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Hermetic tests (live LLM deselected)
        run: uv run pytest tests -q -n auto --dist loadgroup -m "not live_llm and not benchmark"
      - name: Prove live tests skip under CI override
        # Expect exactly one skipped test; provider activity here is a failure.
        run: |
          output="$(env -u BACKSTITCH_LIVE_LLM uv run pytest tests/live/test_live_llm.py -q -o run_live_llm=false 2>&1)"
          printf '%s\n' "${output}"
          grep -Eq 'SKIPPED \[1\]' <<< "${output}"
      - name: Lint and suppression policy
        run: |
          uv run --frozen --no-sync ruff check . bin/check-doc-paths bin/check-dom15-fixtures bin/coalesce-check
          uv run --frozen --no-sync python bin/ruff_suppression_index.py --check
      - name: Format
        run: >
          uv run ruff format --check
          backstitch
          bin
          .github/scripts
          tests
      - name: Types
        run: uv run mypy backstitch bin/release.py tests --config-file pyproject.toml
      - name: Self-corpus gate
        run: uv run backstitch check --repo-root .

  benchmark:
    name: benchmarks py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Serial wall-clock benchmarks
        run: uv run pytest tests -q -n 0 -m benchmark

  coverage:
    name: coverage py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests with coverage
        run: |
          uv run coverage erase
          uv run pytest tests -q -n auto --dist loadgroup -m "not live_llm and not benchmark" --cov=backstitch --cov-report=
          uv run coverage report --show-missing
          uv run coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: VanL/backstitch

  binary-wheels:
    name: binary wheels py${{ matrix.python-version }} ${{ matrix.platform.os }}-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: x64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Prove dependencies install from wheels
        run: uv sync --locked --extra dev --no-build --no-install-project
