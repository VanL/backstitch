name: local-llm

# Disposable experiment branch only. Do not merge this replacement into main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Docker CPU / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [qwen, bonsai]
    env:
      UV_VERSION: "0.12.5"
      BACKSTITCH_LIVE_LLM: "1"
      BACKSTITCH_LIVE_LLM_KIND: local
      OLLAMA_CONTEXT_LENGTH: "4096"
      BACKSTITCH_LOCAL_LLM_UPSTREAM: http://127.0.0.1:11434/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false
      - name: Prepare evidence and dependencies
        run: |
          set -euo pipefail
          mkdir -p .cache/bonsai-comparison/results
          echo "BACKSTITCH_LOCAL_EVAL_REPORT=$PWD/.cache/bonsai-comparison/results/ci-${{ matrix.model }}.json" >> "$GITHUB_ENV"
          uv sync --extra dev --locked
          uname -a > .cache/bonsai-comparison/results/host.txt
          lscpu >> .cache/bonsai-comparison/results/host.txt
          free -b >> .cache/bonsai-comparison/results/host.txt
      - name: Provision Qwen Docker runner
        if: matrix.model == 'qwen'
        run: |
          set -euo pipefail
          docker run -d --name comparison-model --cpus=4 --memory=16g --memory-swap=16g \
            -p 127.0.0.1:11434:11434 \
            ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          docker exec comparison-model ollama pull qwen2.5-coder:14b-instruct-q4_K_M
          curl -fsS http://127.0.0.1:11434/api/tags > .cache/bonsai-comparison/results/qwen-tags.json
          python - <<'PY'
          import json
          from pathlib import Path
          models = json.loads(Path('.cache/bonsai-comparison/results/qwen-tags.json').read_text())['models']
          model = next(m for m in models if m['name'] == 'qwen2.5-coder:14b-instruct-q4_K_M')
          assert model['digest'] == '9ec8897f747e246e970bc5cfdda85d22f1123dc2e3d34978a010a75968716849', model
          PY
          cat > .cache/Modelfile <<'MODEL'
          FROM qwen2.5-coder:14b-instruct-q4_K_M
          PARAMETER num_ctx 4096
          PARAMETER num_predict 1024
          PARAMETER num_thread 4
          PARAMETER temperature 0
          PARAMETER seed 42
          MODEL
          docker cp .cache/Modelfile comparison-model:/tmp/Modelfile
          docker exec comparison-model ollama create comparison-qwen:latest -f /tmp/Modelfile
          docker exec comparison-model ollama show comparison-qwen:latest --parameters > .cache/bonsai-comparison/results/qwen-parameters.txt
          echo 'BACKSTITCH_LOCAL_LLM_SERVED_MODEL=comparison-qwen:latest' >> "$GITHUB_ENV"
          echo 'BACKSTITCH_LOCAL_EVAL_REVISION=sha256:9ec8897f747e246e970bc5cfdda85d22f1123dc2e3d34978a010a75968716849' >> "$GITHUB_ENV"
      - name: Provision Bonsai Docker runner
        if: matrix.model == 'bonsai'
        run: |
          set -euo pipefail
          task_dir="$PWD/.cache/bonsai-comparison"
          mkdir -p "$task_dir/docker-runtime" "$task_dir/models"
          curl -fL --retry 3 -o "$task_dir/runtime.tar.gz" https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b10685-7dffb15/llama-prism-b10685-7dffb15-bin-ubuntu-x64.tar.gz
          echo "a1fd3a575e70532567845815a042428831771661b857e80f06422fb08904cb7f  $task_dir/runtime.tar.gz" | sha256sum -c -
          tar -xzf "$task_dir/runtime.tar.gz" -C "$task_dir/docker-runtime" --strip-components=1
          curl -fL --retry 3 -o "$task_dir/models/Bonsai-2-27B-PQ2_0.gguf" https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PQ2_0.gguf
          echo "3907dc1658db1f78a9826bf8d5bcb8dc65db0d466388937af57f2294fae62ec1  $task_dir/models/Bonsai-2-27B-PQ2_0.gguf" | sha256sum -c -
          printf 'models/\nresults/\n*.tar.gz\n' > "$task_dir/.dockerignore"
          cat > "$task_dir/Dockerfile" <<'DOCKER'
          FROM ubuntu:24.04@sha256:b3cc40b72b93588182b5410f723c7aaf142363311c2aa993d8a453ddcbb3ae15
          RUN apt-get update && apt-get install -y --no-install-recommends libgomp1 libcurl4t64 ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY docker-runtime/ /runtime/
          ENTRYPOINT ["/runtime/llama-server"]
          DOCKER
          docker build -t comparison-bonsai "$task_dir"
          docker run -d --name comparison-model --cpus=4 --memory=16g --memory-swap=16g \
            -p 127.0.0.1:11434:8080 -v "$task_dir/models:/models:ro" comparison-bonsai \
            -m /models/Bonsai-2-27B-PQ2_0.gguf --alias bonsai2-27b-pq2 --host 0.0.0.0 --port 8080 \
            -ngl 0 -t 4 -tb 4 -c 4096 -np 1 -n 1024 --temp 0 --seed 42 --reasoning off --no-context-shift
          echo 'BACKSTITCH_LOCAL_LLM_SERVED_MODEL=bonsai2-27b-pq2' >> "$GITHUB_ENV"
          echo 'BACKSTITCH_LOCAL_EVAL_REVISION=3907dc1658db1f78a9826bf8d5bcb8dc65db0d466388937af57f2294fae62ec1' >> "$GITHUB_ENV"
      - name: Verify runner profile and readiness
        run: |
          set -euo pipefail
          docker inspect comparison-model > .cache/bonsai-comparison/results/container.json
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('.cache/bonsai-comparison/results/container.json').read_text())[0]['HostConfig']
          assert config['NanoCpus'] == 4_000_000_000
          assert config['Memory'] == config['MemorySwap'] == 16 * 1024**3
          assert not config['DeviceRequests']
          PY
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:11434/v1/models; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run production semantic smoke and replay
        timeout-minutes: 33
        run: |
          set -o pipefail
          uv run python -m pytest tests/live/test_live_llm.py::test_local_semantic_eval_smoke -q -s \
            --basetemp=.cache/comparison-pytest 2>&1 | tee .cache/bonsai-comparison/results/pytest.txt
      - name: Capture runtime evidence
        if: always()
        run: |
          mkdir -p .cache/bonsai-comparison/results
          docker logs comparison-model > .cache/bonsai-comparison/results/server.log 2>&1 || true
          docker stats --no-stream comparison-model > .cache/bonsai-comparison/results/docker-stats.txt || true
          docker exec comparison-model sh -c 'for f in memory.peak memory.max memory.events cpu.max cpu.stat; do echo "$f"; cat "/sys/fs/cgroup/$f"; done' > .cache/bonsai-comparison/results/cgroup.txt || true
          docker inspect comparison-model > .cache/bonsai-comparison/results/container-final.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: comparison-${{ matrix.model }}-${{ github.run_id }}
          path: .cache/bonsai-comparison/results/
          if-no-files-found: error
          retention-days: 14
      - name: Stop experiment runner
        if: always()
        run: docker stop comparison-model || true
