name: Release Gate (backstitch)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"
  PACKAGE_NAME: backstitch
  PACKAGE_DIR: .

jobs:
  require-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require CI and local-llm workflows to be green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/require_green_workflows.py \
            --workflow "CI" \
            --workflow "local-llm"

  verify-tag-current:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs:
      - require-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag still points at tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" "refs/tags/${TAG_NAME}^{}" | awk 'NR==1 { sha=$1 } END { print $1 ? $1 : sha }')"
          if [ -z "${remote_sha}" ]; then
            echo "Tag ${TAG_NAME} no longer exists on origin"
            exit 1
          fi
          if [ "${remote_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Tag ${TAG_NAME} moved while the release gate was running"
            echo "expected: ${EXPECTED_SHA}"
            echo "actual:   ${remote_sha}"
            exit 1
          fi

  build:
    needs:
      - require-ci
      - verify-tag-current
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        id: sync-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify checked out commit matches tested release commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_PYPROJECT="${PACKAGE_DIR}/pyproject.toml"
          python - "$TAG_VERSION" "$PACKAGE_PYPROJECT" <<'PY'
          import sys
          import tomllib

          tag = sys.argv[1]
          pyproject_path = sys.argv[2]
          with open(pyproject_path, "rb") as pyproject_file:
              package_version = tomllib.load(pyproject_file)["project"]["version"]
          if package_version != tag:
              raise SystemExit(f"tag {tag} != pyproject version {package_version}")
          PY

      - name: Install locked build frontend
        run: uv sync --frozen --group release --python "${{ steps.sync-python.outputs.python-path }}"

      - name: Build package
        run: |
          uv run --frozen --no-sync python -m build --no-isolation "${PACKAGE_DIR}"

      - name: Smoke-test built distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${PACKAGE_DIR}"/dist/*.whl)
          sdists=("${PACKAGE_DIR}"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          wheel="$(realpath "${wheels[0]}")"
          sdist="$(realpath "${sdists[0]}")"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          smoke_distribution() {
            artifact="$1"
            environment="$2"
            python -m venv "${environment}"
            "${environment}/bin/python" -m pip install --disable-pip-version-check "${artifact}"
            (
              cd "${smoke_root}"
              "${environment}/bin/python" - "${environment}" <<'PY'
          import pathlib
          import sys

          import backstitch

          environment = pathlib.Path(sys.argv[1]).resolve()
          installed = pathlib.Path(backstitch.__file__).resolve()
          if not installed.is_relative_to(environment):
              raise SystemExit(f"backstitch imported outside smoke environment: {installed}")
          PY
              "${environment}/bin/backstitch" --version
              "${environment}/bin/backstitch" guide alignment --format json
              "${environment}/bin/backstitch" check --repo-root "${GITHUB_WORKSPACE}"
            )
          }

          smoke_distribution "${wheel}" "${smoke_root}/wheel-env"
          smoke_distribution "${sdist}" "${smoke_root}/sdist-env"

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE_DIR }}/dist/*

      - name: Stage attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          safe_tag="$(printf '%s' "${TAG_NAME}" | tr '/:' '--')"
          cp "${BUNDLE_PATH}" "attestations/${PACKAGE_NAME}-${safe_tag}.sigstore.json"

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-python-package-distributions
          path: ${{ env.PACKAGE_DIR }}/dist/

      - name: Store the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-attestations
          path: attestations/*.sigstore.json

  stage-github-release:
    name: Stage draft GitHub Release
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download all the dists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${PACKAGE_NAME}-python-package-distributions" --dir dist/

      - name: Download attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${PACKAGE_NAME}-attestations" --dir attestations/

      - name: Remove stale matching draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_publication.py replace-draft \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expected-sha "${GITHUB_SHA}"

      - name: Stage complete draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.whl
            attestations/*.sigstore.json

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - stage-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: pypi
      url: https://pypi.org/p/backstitch
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download all the dists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${PACKAGE_NAME}-python-package-distributions" --dir dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github-release:
    name: Publish immutable GitHub Release
    needs:
      - stage-github-release
      - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download all the dists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${PACKAGE_NAME}-python-package-distributions" --dir dist/

      - name: Download attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${PACKAGE_NAME}-attestations" --dir attestations/

      - name: Verify assets and publish draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t asset_paths < <(find dist attestations -type f -print | sort)
          asset_args=()
          for path in "${asset_paths[@]}"; do
            asset_args+=(--expected-asset "${path##*/}")
          done
          python .github/scripts/release_publication.py publish-draft \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expected-sha "${GITHUB_SHA}" \
            --package "${PACKAGE_NAME}" \
            --version "${GITHUB_REF_NAME#v}" \
            "${asset_args[@]}"
