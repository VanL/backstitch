name: semantic-refresh

on:
  repository_dispatch:
    types: [semantic-refresh]

permissions:
  contents: read

concurrency:
  group: semantic-refresh-main
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.5"

jobs:
  refresh:
    name: trusted semantic refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKSTITCH_CACHE_ROOT: ${{ github.workspace }}/.backstitch/semantic-cache
      BACKSTITCH_REPORT_ROOT: ${{ runner.temp }}/semantic-refresh/.backstitch/review
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Assert trusted checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Require provider credential
        id: credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is required for trusted semantic refresh"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Prepare fresh report root
        run: |
          test "${BACKSTITCH_CACHE_ROOT}" = "${GITHUB_WORKSPACE}/.backstitch/semantic-cache"
          test "${BACKSTITCH_REPORT_ROOT}" = "${RUNNER_TEMP}/semantic-refresh/.backstitch/review"
          rm -rf "${BACKSTITCH_REPORT_ROOT}"
          mkdir -p "${BACKSTITCH_REPORT_ROOT}"
      - name: Restore immutable semantic cache
        id: cache-restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BACKSTITCH_CACHE_ROOT }}/packets
            ${{ env.BACKSTITCH_CACHE_ROOT }}/results
            ${{ env.BACKSTITCH_CACHE_ROOT }}/baselines
            ${{ env.BACKSTITCH_CACHE_ROOT }}/verify-results
          key: semantic-refresh-v1-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: semantic-refresh-v1-cache-v1-
      - name: Prepare restored semantic cache
        id: cache-prep
        run: |
          test "${BACKSTITCH_CACHE_ROOT}" = "${GITHUB_WORKSPACE}/.backstitch/semantic-cache"
          if [ "${{ steps.cache-restore.outcome }}" = "failure" ]; then
            rm -rf "${BACKSTITCH_CACHE_ROOT}"
          fi
          mkdir -p \
            "${BACKSTITCH_CACHE_ROOT}/packets" \
            "${BACKSTITCH_CACHE_ROOT}/results" \
            "${BACKSTITCH_CACHE_ROOT}/baselines" \
            "${BACKSTITCH_CACHE_ROOT}/verify-results"
      - name: Refresh current-source dogfood cache
        id: analyze
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >
          env -u LLM_MODEL uv run backstitch analyze
          --repo-root .
          --config pyproject.toml
          --option analyze.cache_mode read-write
          --option verify.enabled true
          --option verify.cache_mode read-write
          --packets-output "${BACKSTITCH_REPORT_ROOT}/packets.jsonl"
          --packet-report-output "${BACKSTITCH_REPORT_ROOT}/packet-report.json"
          --output "${BACKSTITCH_REPORT_ROOT}/results.jsonl"
          --report "${BACKSTITCH_REPORT_ROOT}/analysis-report.json"
      - name: Measure semantic eval baseline
        id: eval
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >
          env -u LLM_MODEL uv run backstitch eval
          --config pyproject.toml
          --option analyze.cache_mode read-write
          --option verify.enabled true
          --option verify.cache_mode read-write
          --corpus tests/semantic_eval/v3/manifest.json
          --output "${BACKSTITCH_REPORT_ROOT}/eval-report.json"
      - name: Save immutable semantic cache
        id: cache-save
        if: ${{ !cancelled() && steps.cache-prep.outcome == 'success' && steps.analyze.outcome == 'success' && steps.eval.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BACKSTITCH_CACHE_ROOT }}/packets
            ${{ env.BACKSTITCH_CACHE_ROOT }}/results
            ${{ env.BACKSTITCH_CACHE_ROOT }}/baselines
            ${{ env.BACKSTITCH_CACHE_ROOT }}/verify-results
          key: semantic-refresh-v1-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-refresh-${{ github.run_id }}
          path: ${{ env.BACKSTITCH_REPORT_ROOT }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce refresh result
        if: always()
        run: |
          failed=0
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "::error::semantic dogfood analysis did not complete"
            failed=1
          fi
          if [ "${{ steps.eval.outcome }}" != "success" ]; then
            echo "::error::schema-3 semantic eval smoke did not complete"
            failed=1
          fi
          if [ "${{ steps.cache-save.outcome }}" = "failure" ]; then
            echo "::error::semantic cache persistence failed"
            failed=1
          fi
          exit "${failed}"
