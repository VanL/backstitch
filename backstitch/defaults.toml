exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "dist",
  "build",
  ".worktrees",
]
default_command = false

[defaults]
schema_version = 1

[profile]
name = "backstitch-style-v1"
spec_roots = ["docs/specs"]
plan_roots = ["docs/plans"]
code_roots = ["backstitch", "tests"]
test_roots = ["tests"]
planned_spec_globs = []
exploratory_spec_globs = []
meta_spec_globs = []
process_spec_globs = []

[check]
format = "text"
warnings_as_errors = false

[coverage]
mode = "report"
format = "text"
granularity = "definition"
inherited_counts = false
ratchet_base = ""
exemptions = []
maximum_baseline_files = 20000
maximum_file_bytes = 5000000
maximum_baseline_bytes = 100000000
maximum_history_commits = 1000
maximum_git_command_seconds = 10.0
maximum_git_commands = 64
maximum_git_output_bytes = 100000000
maximum_commit_message_bytes = 1000000
maximum_runtime_seconds = 60.0

[coverage.floors]

[obligations]
section_required_roles = ["implementation"]
page_size = 5
maximum_page_size = 100
maximum_response_bytes = 65536
maximum_candidate_items = 2000
maximum_catalog_items = 100000
maximum_lexical_seeds = 10
maximum_snapshot_files = 20000
maximum_file_bytes = 5000000
maximum_snapshot_bytes = 100000000
maximum_work_units = 2000000
maximum_packet_bytes = 10000000
maximum_packet_report_bytes = 10000000
maximum_call_seconds = 10.0
snapshot_capture_attempts = 3
static_neighbor_depth = 1

[analyze]
backend_id = "llm"
plugin_id = ""
plugin_distribution_name = ""
model = ""
model_revision = ""
capability_schema_version = 1
capability_revision = "packaged-compatible-v1"
maximum_input_bytes = 10000000
concurrency = 1
json_mode = "prefer"
temperature = 0.0
seed = 42
max_tokens = 512
cache_path = ".backstitch/semantic-cache"
cache_mode = "off"
result_reuse = "evidence-stable"
search_epoch = "1"
require_complete = false
required_kinds = []
minimum_packets = 0
maximum_packets = 1000
maximum_prompt_bytes = 10000000
finding_handling = "report"
maximum_provider_calls = 1000
lock_wait_timeout_seconds = 300
maximum_runtime_seconds = 1800
maximum_estimated_cost_microusd = 0
input_cost_microusd_per_million_tokens = 0
output_cost_microusd_per_million_tokens = 0
input_token_overhead = 256
cost_rate_source = ""

[analyze.request_constraints.json_mode]
presence = "required"
allowed_values = ["require", "off"]

[analyze.request_constraints.temperature]
presence = "required"
allowed_values = [0.0]

[analyze.request_constraints.seed]
presence = "required"
minimum = 0
maximum = 9223372036854775807

[analyze.request_constraints.max_tokens]
presence = "required"
minimum = 1
maximum = 2147483647

[verify]
enabled = false

[lint]
warn_unused_ignores = true
require_suppression_declarations = false
suppressions = []

[diagnostics]
default_level = "warning"
fail_on = ["error"]
suppressible_levels = ["warning", "info"]

[[diagnostics.levels]]
select = [
  "SCAN_ROOT_MISSING",
  "FILE_UNREADABLE",
  "SPEC_FILE_MISSING",
  "SPEC_SECTION_MISSING",
  "SPEC_SECTION_HEADING_INVALID",
  "SPEC_ANCHOR_MISSING",
  "REF_RANGE_UNSUPPORTED",
  "TARGET_PATH_AMBIGUOUS",
  "MAPPING_SYMBOL_MISSING",
  "SPEC_SECTION_AMBIGUOUS:asserted",
  "MAPPING_PATH_MISSING:required",
  "INVARIANT_UNTESTED:required",
  "INVARIANT_UNKNOWN",
  "INVARIANT_DUPLICATE",
  "INVARIANT_MARKER_INVALID",
]
level = "error"

[[diagnostics.levels]]
select = [
  "SPEC_SECTION_UNMAPPED",
  "CODE_REF_UNMAPPED_FROM_SPEC",
]
level = "info"

[[diagnostics.levels]]
select = [
  "SPEC_SECTION_AMBIGUOUS:weak",
  "MAPPING_PATH_MISSING:plan-artifact",
  "INVARIANT_UNTESTED:draft",
  "INVARIANT_BINDING_NOT_TEST",
]
level = "warning"

# [SEM-6]: each semantic code/state pair is an exact selector so semantic
# failure authority can audit the actual winning rule. Keep these rules and
# their registry contexts synchronized as one enumerable contract.
